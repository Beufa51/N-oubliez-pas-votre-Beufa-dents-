<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14b8c4">
  <title>N'oubliez pas votre Beufa dents</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">

  <!-- ACCUEIL -->
  <section id="ecran-accueil" class="ecran actif">
    <h1 class="titre">N'oubliez pas votre <span>Beufa dents</span></h1>
    <img class="mascotte-accueil" src="assets/mascotte/png/pose-main-levee.png" alt="Beufa, la brosse à dents mascotte, qui salue">

    <div class="carte">
      <h2>Mode</h2>
      <div class="choix" id="choix-mode">
        <button class="option actif" data-mode="classique" type="button">
          <strong>Classique</strong><small>Minuteur + zones</small>
        </button>
        <button class="option" data-mode="beufa" type="button">
          <strong>Beufa dents</strong><small>Poses &amp; photos</small>
        </button>
      </div>

      <h2>Durée</h2>
      <div class="choix" id="choix-duree">
        <button class="option" data-duree="60" type="button"><strong>1 min</strong><small>Express</small></button>
        <button class="option actif" data-duree="120" type="button"><strong>2 min</strong><small>Recommandé</small></button>
      </div>

      <h2>Caméra</h2>
      <div class="choix" id="choix-camera">
        <button class="option actif" data-camera="0" type="button"><strong>Sans</strong><small>Schéma seul</small></button>
        <button class="option" data-camera="1" type="button"><strong>Miroir</strong><small>Je me vois brosser</small></button>
      </div>

      <button id="btn-demarrer" class="gros-bouton" type="button">C'est parti !</button>
    </div>
  </section>

  <!-- BROSSAGE -->
  <section id="ecran-brossage" class="ecran">
    <header class="entete">
      <div class="minuteur">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="anneau-fond" cx="60" cy="60" r="52"/>
          <circle id="anneau" class="anneau" cx="60" cy="60" r="52"/>
        </svg>
        <div id="temps" class="temps" aria-live="off">2:00</div>
      </div>
      <div class="consigne">
        <div id="zone-nom" class="zone-nom">Haut gauche</div>
        <div id="face-nom" class="face-nom">Face extérieure</div>
        <div class="points" id="points"><i></i><i></i><i></i></div>
      </div>
    </header>

    <div class="scene" id="scene">
      <video id="camera" playsinline muted autoplay aria-label="Ta caméra en miroir"></video>
      <div id="cadre" class="cadre" hidden aria-hidden="true">
        <div class="cadre-tete"><span>Ta tête ici</span></div>
        <img id="partenaire" class="partenaire" alt="">
        <div id="bulle" class="bulle"></div>
        <img id="apercu" class="apercu" alt="" hidden>
      </div>
      <div id="flash" class="flash" aria-hidden="true"></div>
      <svg id="bouche" viewBox="0 0 300 340" role="img" aria-label="Schéma de la bouche : zone à brosser"></svg>
      <div id="astuce" class="astuce"></div>
      <div id="toast" class="toast" hidden></div>
      <img id="mascotte" class="mascotte" src="assets/mascotte/png/pose-mains-hanches.png" alt="">
    </div>

    <button id="btn-arreter" class="lien" type="button">Arrêter</button>

    <div id="pause" class="pause" hidden>
      <div class="pause-boite">
        <div id="pause-titre" class="pause-titre">Pause !</div>
        <div id="pause-compte" class="pause-compte">3</div>
        <div id="pause-suite" class="pause-suite"></div>
      </div>
    </div>
  </section>

  <!-- FIN -->
  <section id="ecran-fin" class="ecran">
    <div class="confettis" id="confettis" aria-hidden="true"></div>
    <h1 class="titre">Bravo&nbsp;!</h1>
    <img class="mascotte-accueil" src="assets/mascotte/png/pose-pouce.png" alt="Beufa fait un pouce en l'air">
    <p class="fin-texte">Dents brillantes, sourire éclatant ✨</p>
    <div id="montages" class="montages" hidden>
      <h2>Tes photos avec Beufa</h2>
      <div id="galerie" class="galerie"></div>
      <small>Appuie sur une photo pour l'enregistrer ou la partager. Elles restent sur ton téléphone.</small>
    </div>
    <button id="btn-recommencer" class="gros-bouton" type="button">Recommencer</button>
    <div id="visionneuse" class="visionneuse" hidden>
      <img id="vision-img" alt="Photo souvenir avec Beufa">
      <div class="vision-actions">
        <a id="btn-enregistrer" class="gros-bouton" href="#" download>Enregistrer</a>
        <button id="btn-partager" class="gros-bouton" type="button" hidden>Partager</button>
        <button id="btn-fermer" class="lien" type="button">Fermer</button>
      </div>
    </div>
  </section>

</main>
<script src="js/app.js"></script>
</body>
</html>
